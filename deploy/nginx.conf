server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Every page is pre-rendered to <path>/index.html; anything else is a real 404.
    location / {
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "no-cache";
        add_header X-Atid-Revision "$ATID_REVISION" always;
    }

    location = /app {
        return 301 /app/home;
    }

    location = /app/ {
        return 301 /app/home;
    }

    # Vite fingerprints everything under assets/, so it can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
